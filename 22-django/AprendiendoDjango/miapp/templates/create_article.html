{% extends 'layout.html' %}
{% load filters %}

{% block title %}Formularios en Django{% endblock %}

{% block content %}
<h1 class="title">FORMULARIOS EN DJANGO</h1>

<!-- <form action="/save-article"></form> -->
<!-- <form action="{% url 'save' %}"></form> -->

<form action="{% url 'save' %}" method="GET">
    <label for="title">Titulo:</label>
    <input type="text" name="title" placeholder="Mete tu nombre"/>
    
    <label for="content">Contenido:</label>
    <textarea name="content"></textarea>

    <label for="public">¿Publicado?</label>
    <select name="public">
        <option value="1">SI</option>
        <option value="0">NO</option>
    </select>

    <input type="submit" value="Guardar" />


</form>
{% endblock %}
