{% extends 'layout.html' %}
{% load filters %}

{% block title %}Formularios en Django{% endblock %}

{% block content %}
<h1 class="title">FORMULARIOS EN DJANGO SIN html y solo CON Formularios</h1>

{% if form.errors %}
    <strong class="rojo">
        Hay errores en el Formulario
        {{ form.errors}}
    </strong>
{% endif %}

<form action="" method="POST">
    
    {% csrf_token %}
     
    {{ form }}

    <input type="submit" value="Guardar" />


</form>
{% endblock %}
